[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "ladis"
version = "0.1.1"
description = "Latent diffusion for synthetic tabular network traffic and intrusion data."
readme = "README.md"
requires-python = ">=3.10"

license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
]

authors = [
    { name = "Estela Sánchez-Carballo" },
]

maintainers = [
    { name = "Estela Sánchez-Carballo" },
]

keywords = [
    "latent-diffusion",
    "diffusion-models",
    "synthetic-data",
    "tabular-data",
    "intrusion-detection",
    "network-traffic",
    "iot",
    "cybersecurity",
    "data-augmentation",
    "generative-models",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "sdmetrics>=0.33.0,<0.34",
    "joblib",
    "pyarrow",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]


[project.optional-dependencies]
pcap = [
    "scapy>=2.8,<2.9",
    "tqdm>=4.66,<5",
]

dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/estelasc/LaDIS"
Repository = "https://github.com/estelasc/LaDIS"
Issues = "https://github.com/estelasc/LaDIS/issues"
Paper = "https://arxiv.org/abs/2601.16976"


[tool.setuptools.packages.find]
where = ["."]
include = ["ladis*"]